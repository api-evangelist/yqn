name: YQN
description: 'YQN is a global digital logistics platform and NVOCC / digital freight forwarder founded
  in 2015 and headquartered in Shanghai, China. It lets shippers compare rates, book, and manage
  international sea freight, air freight, and rail freight, multimodal transport, trucking, customs
  clearance, cargo insurance, and overseas warehousing online. YQN operates 25+ global branches
  across North America, Latin America, Southeast Asia, and the Middle East with 1,500+ employees,
  300+ shipping and airline partners, and 3,500+ supplier resources. It integrates directly with
  carriers such as Lufthansa Cargo via carrier APIs for rate-checking, allotment booking, and
  digital bill-of-lading generation. YQN holds FIATA, IATA, and NVOCC certifications, but publishes
  no public developer API portal or documentation.'
